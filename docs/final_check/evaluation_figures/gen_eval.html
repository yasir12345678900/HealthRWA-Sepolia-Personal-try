<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:'Segoe UI',Calibri,Arial,sans-serif}
.wrap{padding:10px 14px;display:inline-block;background:#fff}
text{font-family:'Segoe UI',Calibri,Arial,sans-serif}
</style>
<script src="eval_data.js"></script>
<script src="attacks.js"></script>
</head><body>
<script>
/* Print sizing: each figure is placed at 600 px (6.25 in). With a total width of about 1,000 CSS px,
   1 CSS px prints at about 0.44 pt, so 18 px is about 8 pt and 16 px about 7 pt. */
const INK="#0b0b0b", INK2="#52514e", MUTED="#898781", GRID="#e1e0d9", AXIS="#c3c2b7";
const BLUE="#2a78d6", ORANGE="#eb6834", GOOD="#0ca30c", CRIT="#d03b3b", SURF="#ffffff";
const fmt = n => Math.round(n).toLocaleString("en-AU");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function T(x,y,s,o={}){return `<text x="${x}" y="${y}" text-anchor="${o.a||"start"}" style="font-size:${o.fs||18}px;font-weight:${o.w||400};fill:${o.c||INK}"${o.halo?' paint-order="stroke" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"':""}>${esc(s)}</text>`;}
function svg(id,w,h,inner){document.write(`<div class="wrap" id="${id}"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${inner}</svg></div>`);}
function hbar(x0,y,len,h,fill){const r=Math.min(4,len/2);return `<path d="M ${x0} ${y} H ${x0+len-r} Q ${x0+len} ${y} ${x0+len} ${y+r} V ${y+h-r} Q ${x0+len} ${y+h} ${x0+len-r} ${y+h} H ${x0} Z" fill="${fill}"/>`;}
</script>

<script>
/* ---------- Figure 41: gas used per anchored transaction ---------- */
{
const W=1000, X0=342, XW=400, rowH=68, barH=30, max=200000, GH=40;
const sx=v=>X0+v/max*XW;
const groups=[{t:"Previous deployment, 22 September 2026",rows:[0,1]},{t:"Current ConsentSBTv3 deployment, 24 September 2026",rows:[2,3,4]}];
let s="", y=54; const ry=[], heads=[];
groups.forEach((g,gi)=>{ heads.push(y); y+=GH; g.rows.forEach(r=>{ry[r]=y; y+=rowH;}); if(gi===0) y+=10; });
const bottom=y;
s+=`<rect x="${X0}" y="12" width="16" height="16" rx="2" fill="${BLUE}"/>`+T(X0+24,26,"Mint",{fs:18,c:INK2});
s+=`<rect x="${X0+100}" y="12" width="16" height="16" rx="2" fill="${ORANGE}"/>`+T(X0+124,26,"Revocation",{fs:18,c:INK2});
groups.forEach((g,gi)=>{ const y1=heads[gi]+GH-4, y2=ry[g.rows[g.rows.length-1]]+rowH;
  for(let v=0;v<=max;v+=50000){const x=sx(v);s+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${v===0?AXIS:GRID}" stroke-width="${v===0?1.5:1}"/>`;} });
for(let v=0;v<=max;v+=50000){const x=sx(v); s+=T(x,bottom+24,v===0?"0":fmt(v),{a:"middle",fs:17,c:INK2});}
s+=T(X0+XW/2,bottom+52,"Gas used",{a:"middle",fs:17,c:INK2,w:600});
groups.forEach((g,gi)=>{ if(gi>0) s+=`<line x1="14" y1="${heads[gi]-5}" x2="${W-14}" y2="${heads[gi]-5}" stroke="${AXIS}" stroke-dasharray="4 4"/>`;
  s+=T(14,heads[gi]+24,g.t,{fs:17,c:INK2,w:700}); });
TX.forEach((t,i)=>{
  const yb=ry[i]+(rowH-barH)/2;
  s+=T(X0-12,yb+12,`${t.op}, token ${t.token}`,{a:"end",fs:19,w:600});
  s+=T(X0-12,yb+33,`consent ${t.consent}, block ${fmt(t.block)}`,{a:"end",fs:17,c:INK2});
  s+=hbar(X0,yb,sx(t.gas)-X0,barH,t.op==="Mint"?BLUE:ORANGE);
  s+=T(sx(t.gas)+10,yb+12,`${fmt(t.gas)} gas`,{fs:18,w:600,halo:1});
  s+=T(sx(t.gas)+10,yb+33,`${t.fee.toFixed(6)} ETH at ${t.gwei.toFixed(2)} gwei`,{fs:17,c:INK2,halo:1});
});
svg("f41",W,bottom+64,s);
}
</script>

<script>
/* ---------- Figure 42: processing time per component, log scale ---------- */
{
const W=1000, X0=430, XW=460, top=56, rowH=62;
const lo=-3, hi=5;
const sx=ms=>X0+(Math.log10(ms)-lo)/(hi-lo)*XW;
const tick=["1 µs","10 µs","100 µs","1 ms","10 ms","100 ms","1 s","10 s","100 s"];
const lab=ms=> ms<0.01? (ms*1000).toFixed(2)+" µs" : ms<100? ms.toFixed(1)+" ms" : ms<1000? Math.round(ms)+" ms" : (ms/1000).toFixed(ms<10000?2:1)+" s";
let s="";
s+=`<circle cx="${X0+7}" cy="22" r="7" fill="${BLUE}" stroke="${SURF}" stroke-width="2"/>`+T(X0+20,28,"median",{fs:17,c:INK2});
s+=`<line x1="${X0+110}" y1="22" x2="${X0+154}" y2="22" stroke="${BLUE}" stroke-width="2"/><line x1="${X0+110}" y1="15" x2="${X0+110}" y2="29" stroke="${BLUE}" stroke-width="2"/><line x1="${X0+154}" y1="15" x2="${X0+154}" y2="29" stroke="${BLUE}" stroke-width="2"/>`+T(X0+164,28,"minimum to maximum",{fs:17,c:INK2});
const H=rowH*COMP.length;
for(let k=lo;k<=hi;k++){const x=sx(Math.pow(10,k));s+=`<line x1="${x}" y1="${top-6}" x2="${x}" y2="${top+H}" stroke="${GRID}"/>`;s+=T(x,top+H+24,tick[k-lo],{a:"middle",fs:16.5,c:INK2});}
s+=`<line x1="${X0}" y1="${top+H}" x2="${X0+XW}" y2="${top+H}" stroke="${AXIS}" stroke-width="1.5"/>`;
s+=T(X0+XW/2,top+H+52,"Time per operation (logarithmic scale)",{a:"middle",fs:17,c:INK2,w:600});
const bgY=top+rowH*5;
s+=`<line x1="14" y1="${bgY}" x2="${W-14}" y2="${bgY}" stroke="${AXIS}" stroke-dasharray="4 4"/>`;
COMP.forEach((c,i)=>{
  const y=top+i*rowH+rowH/2;
  s+=T(X0-16,y-2,c.name,{a:"end",fs:18,w:600});
  s+=T(X0-16,y+20,c.n,{a:"end",fs:17,c:INK2});
  const x1=sx(c.mn), x2=sx(c.mx), xm=sx(c.med);
  s+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${BLUE}" stroke-width="2"/>`;
  s+=`<line x1="${x1}" y1="${y-7}" x2="${x1}" y2="${y+7}" stroke="${BLUE}" stroke-width="2"/><line x1="${x2}" y1="${y-7}" x2="${x2}" y2="${y+7}" stroke="${BLUE}" stroke-width="2"/>`;
  s+=`<circle cx="${xm}" cy="${y}" r="7" fill="${BLUE}" stroke="${SURF}" stroke-width="2"/>`;
  s+=T(Math.max(x2,xm)+13,y+6,lab(c.med),{fs:18,w:600,halo:1});
});
svg("f42",W,top+H+64,s);
}
</script>

<script>
/* ---------- Figure 43: adversarial evaluation matrix ---------- */
{
const SHORT={A1:"Approval from a signer outside G",A2:"Signature replayed across consents",A3:"Same guardian approves twice",
 A4:"Request beyond the authorised scope",A5:"Request with an empty scope",A6:"Request outside the validity interval",
 A7:"Different declared jurisdiction",A8:"Access after revocation",A9:"Tampered proof or public signal",
 A10:"Honest proof for an expired consent",A11:"Result of an audit event rewritten",A12:"Non-owner mint or revoke, transfer"};
const cols=["I","A","P","T","L","E","Contract"];
const X0=404, CW=38, CWc=80, top=96, rowH=40;
const cx=j=> j<6? X0+j*CW+CW/2 : X0+6*CW+CWc/2;
const OX=X0+6*CW+CWc+16, OW=142;
const W=OX+2*OW+8;
let s="";
s+=T(X0+(6*CW+CWc)/2,22,"Targeted component",{a:"middle",fs:17,c:INK2,w:600});
s+=`<line x1="${X0+4}" y1="31" x2="${X0+6*CW+CWc-4}" y2="31" stroke="${AXIS}"/>`;
s+=T(OX+OW,22,"Outcome",{a:"middle",fs:17,c:INK2,w:600});
s+=`<line x1="${OX+6}" y1="31" x2="${OX+2*OW-6}" y2="31" stroke="${AXIS}"/>`;
cols.forEach((c,j)=>{s+=T(cx(j),top-24,c,{a:"middle",fs:18,w:700});});
s+=T(OX+OW/2,top-44,"Before",{a:"middle",fs:17,w:700})+T(OX+OW/2,top-24,"hardening",{a:"middle",fs:17,w:700});
s+=T(OX+OW*1.5,top-44,"After",{a:"middle",fs:17,w:700})+T(OX+OW*1.5,top-24,"hardening",{a:"middle",fs:17,w:700});
s+=T(14,top-24,"Scenario",{fs:17,w:700});
s+=`<line x1="10" y1="${top-12}" x2="${W-10}" y2="${top-12}" stroke="${AXIS}" stroke-width="1.5"/>`;
const ok=(x,y)=>`<circle cx="${x}" cy="${y}" r="10" fill="${GOOD}"/><path d="M ${x-5} ${y} L ${x-1.2} ${y+4.2} L ${x+5.5} ${y-4.2}" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
const neu=(x,y)=>`<circle cx="${x}" cy="${y}" r="10" fill="#8a8984"/><rect x="${x-5.5}" y="${y-1.3}" width="11" height="2.6" fill="#fff"/>`;
const bad=(x,y)=>`<path d="M ${x} ${y-11} L ${x+11} ${y+9} L ${x-11} ${y+9} Z" fill="${CRIT}" stroke-linejoin="round"/><rect x="${x-1.3}" y="${y-4.5}" width="2.6" height="7.5" fill="#fff"/><rect x="${x-1.3}" y="${y+4.6}" width="2.6" height="2.4" fill="#fff"/>`;
ATT.forEach((a,i)=>{
  const y=top+i*rowH+rowH/2-6;
  if(i%2===1) s+=`<rect x="8" y="${y-rowH/2+2}" width="${W-16}" height="${rowH}" fill="#f6f6f3"/>`;
  s+=T(14,y+6,a.id,{fs:18,w:700});
  s+=T(62,y+6,SHORT[a.id]||a.name,{fs:17.5});
  cols.forEach((c,j)=>{ if(a.comp.includes(c)) s+=`<circle cx="${cx(j)}" cy="${y}" r="8" fill="${INK2}"/>`; else s+=`<circle cx="${cx(j)}" cy="${y}" r="2.2" fill="${AXIS}"/>`; });
  const outc=(x,v)=> /^Accepted/.test(v)? bad(x-52,y)+T(x-36,y+6,"Accepted*",{fs:17,w:700}) : (/^Digest/.test(v)? neu(x-52,y)+T(x-36,y+6,"Differs†",{fs:17}) : ok(x-52,y)+T(x-36,y+6,"Refused",{fs:17}));
  s+=outc(OX+OW/2,a.before);
  s+=outc(OX+OW*1.5,a.after);
});
const yb=top+ATT.length*rowH-6;
s+=`<line x1="10" y1="${yb}" x2="${W-10}" y2="${yb}" stroke="${AXIS}" stroke-width="1.5"/>`;
const notes=["I identity, A authority, P policy and scope, T time, L jurisdiction, E evidence and its",
 "revocation dimension. Contract denotes ConsentSBTv3 executed on an in-memory EVM.",
 "* Accepted at unit level, when the service function of commit b1468b7 was called",
 "  directly. The interface of the 24 September demonstration already refused it.",
 "† The recomputed digest of the rewritten event differs from the stored digest, but no",
 "  component of the prototype compares the two, so a neutral marker is used."];
notes.forEach((l,k)=>{ s+=T(14,yb+28+k*24,l,{fs:18,c:INK2}); });
svg("f43",W,yb+28+6*24,s);
}
</script>
</body></html>
