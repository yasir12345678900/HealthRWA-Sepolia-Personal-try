<script>
const MER = { box:"fill:#FFF8E1;stroke:#C9A227", round:"fill:#FFF8E1;stroke:#C9A227", diam:"fill:#FFF8E1;stroke:#C9A227" };
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function node(n){
  const {x,y,w,h,type,lines,style} = n;
  const st = style || "fill:#FFF8E1;stroke:#C9A227";
  let shape;
  if(type==="round") shape=`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${h/2}" style="${st};stroke-width:1.6"/>`;
  else if(type==="diam") shape=`<polygon points="${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}" style="${st};stroke-width:1.6"/>`;
  else shape=`<rect x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="4" style="${st};stroke-width:1.6"/>`;
  const n0 = lines.length;
  const fs = n.fs || 15.5;
  const lh = fs + 4;
  const y0 = y - (n0-1)*lh/2;
  const txt = lines.map((l,i)=>`<text x="${x}" y="${y0+i*lh+fs*0.35}" text-anchor="middle" style="font-size:${i===0&&n0>1&&n.subFirst!==false&&n.bold1!==false?fs:'' }px"><tspan style="font-size:${(n.small&&i>0)?fs-2.5:fs}px;font-weight:600;fill:#1a1a1a">${esc(l)}</tspan></text>`).join("");
  return shape+txt;
}
function edge(d,label,lx,ly){
  let s=`<path d="${d}" style="stroke:#8a8a5a;stroke-width:1.5;fill:none" marker-end="url(#arr)"/>`;
  if(label) s+=`<rect x="${lx-14}" y="${ly-11}" width="28" height="16" fill="#f2f2f2" opacity="0.9"/><text x="${lx}" y="${ly+2}" text-anchor="middle" style="font-size:14px;font-weight:600;fill:#333">${label}</text>`;
  return s;
}
function svg(id,w,h,inner){
  document.write(`<div class="wrap" id="${id}"><svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#8a8a5a"/></marker></defs>${inner}</svg></div>`);
}
const V = (x,y1,y2,label,ly)=>edge(`M ${x} ${y1} L ${x} ${y2-4}`,label,x+24,ly||((y1+y2)/2));
</script>
